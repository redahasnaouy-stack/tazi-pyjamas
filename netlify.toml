[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
